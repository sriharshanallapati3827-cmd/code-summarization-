
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(ellipse at 50% 20%, #1e293b 0%, #0f172a 50%, #020617 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: #e2e8f0;
      overflow: hidden;
    }
    #pdg-container {
      width: 100%;
      height: 100vh;
      position: relative;
    }
    .pdg-toolbar {
      position: absolute;
      top: 12px;
      left: 14px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid rgba(51, 65, 85, 0.8);
      display: flex;
      gap: 14px;
      align-items: center;
      font-size: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .status-badge {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .pdg-toolbar label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      color: #cbd5e1;
    }
    .pdg-toolbar label:hover {
      color: #ffffff;
    }
    .btn-action {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      background: #334155;
      color: #38bdf8;
      border-color: #38bdf8;
    }
    .legend {
      position: absolute;
      bottom: 12px;
      right: 14px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(51, 65, 85, 0.8);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .legend-title {
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 10px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
    }
    .line-dash {
      width: 16px;
      height: 2px;
      border-top: 2px dashed #38bdf8;
      display: inline-block;
    }
    .line-solid {
      width: 16px;
      height: 2px;
      background: #34d399;
      display: inline-block;
    }
    .line-taint {
      width: 16px;
      height: 3px;
      background: #ef4444;
      display: inline-block;
    }
    #node-details {
      position: absolute;
      top: 12px;
      right: 14px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #38bdf8;
      font-size: 12px;
      display: none;
      max-width: 320px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div id="pdg-container">
    <div class="pdg-toolbar">
      <span class="status-badge">🔒 Static PDG (Fixed)</span>
      <label><input type="checkbox" id="toggle-control" checked /> Control Edges</label>
      <label><input type="checkbox" id="toggle-data" checked /> Data Edges</label>
      <label><input type="checkbox" id="toggle-taint-only" /> Only Tainted</label>
      <button class="btn-action" onclick="network.fit({animation: {duration: 400}})">Center & Fit</button>
    </div>

    <div id="node-details"></div>

    <div class="legend">
      <div class="legend-title">PDG Node Typology</div>
      <div class="legend-item"><span class="dot" style="background:#312e81; border: 1px solid #6366f1;"></span> Function Def</div>
      <div class="legend-item"><span class="dot" style="background:#78350f; border: 1px solid #f59e0b;"></span> Branch (If/For)</div>
      <div class="legend-item"><span class="dot" style="background:#064e3b; border: 1px solid #10b981;"></span> Statement / Assign</div>
      <div class="legend-item"><span class="dot" style="background:#581c87; border: 1px solid #a855f7;"></span> Return Stmt</div>
      <div class="legend-item"><span class="dot" style="background:#7f1d1d; border: 1px solid #ef4444;"></span> Insecure Sink</div>
      <div style="height: 4px;"></div>
      <div class="legend-title">Edge Dependencies</div>
      <div class="legend-item"><span class="line-dash"></span> Control Edge</div>
      <div class="legend-item"><span class="line-solid"></span> Data Dependency</div>
      <div class="legend-item"><span class="line-taint"></span> Tainted Flow</div>
    </div>
  </div>

  <script type="text/javascript">
    const rawNodes = [{"id": "root", "label": "[ROOT] root\nProgram root", "title": "Program Entry Root Node", "shape": "box", "shapeProperties": {"borderRadius": 8}, "color": {"background": "#1e293b", "border": "#38bdf8", "highlight": {"background": "#334155", "border": "#7dd3fc"}}, "borderWidth": 2, "borderWidthSelected": 3, "font": {"color": "#e2e8f0", "face": "system-ui, -apple-system, sans-serif", "size": 12, "bold": true}, "margin": {"top": 8, "bottom": 8, "left": 12, "right": 12}, "shadow": {"enabled": true, "color": "rgba(0,0,0,0.45)", "size": 8, "x": 1, "y": 2}}, {"id": "N0", "label": "[\u26a0\ufe0f TAINTED] N0\nFunction authenticate", "title": "\ud83d\udea8 CRITICAL TAINTED SINK: N0\nFunction authenticate", "shape": "box", "shapeProperties": {"borderRadius": 8}, "color": {"background": "#7f1d1d", "border": "#ef4444", "highlight": {"background": "#991b1b", "border": "#f87171"}}, "borderWidth": 2, "borderWidthSelected": 3, "font": {"color": "#fee2e2", "face": "system-ui, -apple-system, sans-serif", "size": 12, "bold": true}, "margin": {"top": 8, "bottom": 8, "left": 12, "right": 12}, "shadow": {"enabled": true, "color": "rgba(0,0,0,0.45)", "size": 8, "x": 1, "y": 2}}, {"id": "N1", "label": "[STMT] N1\nAssign valid = False", "title": "Statement: Assign valid = False", "shape": "box", "shapeProperties": {"borderRadius": 8}, "color": {"background": "#064e3b", "border": "#10b981", "highlight": {"background": "#065f46", "border": "#34d399"}}, "borderWidth": 2, "borderWidthSelected": 3, "font": {"color": "#d1fae5", "face": "system-ui, -apple-system, sans-serif", "size": 12, "bold": false}, "margin": {"top": 8, "bottom": 8, "left": 12, "right": 12}, "shadow": {"enabled": true, "color": "rgba(0,0,0,0.45)", "size": 8, "x": 1, "y": 2}}, {"id": "N2", "label": "[BRANCH] N2\nIf len(token) > 10", "title": "Control Decision Branch: If len(token) > 10", "shape": "box", "shapeProperties": {"borderRadius": 8}, "color": {"background": "#78350f", "border": "#f59e0b", "highlight": {"background": "#92400e", "border": "#fbbf24"}}, "borderWidth": 2, "borderWidthSelected": 3, "font": {"color": "#fef3c7", "face": "system-ui, -apple-system, sans-serif", "size": 12, "bold": true}, "margin": {"top": 8, "bottom": 8, "left": 12, "right": 12}, "shadow": {"enabled": true, "color": "rgba(0,0,0,0.45)", "size": 8, "x": 1, "y": 2}}, {"id": "N3", "label": "[\u26a0\ufe0f TAINTED] N3\nAssign valid = True", "title": "\ud83d\udea8 CRITICAL TAINTED SINK: N3\nAssign valid = True", "shape": "box", "shapeProperties": {"borderRadius": 8}, "color": {"background": "#7f1d1d", "border": "#ef4444", "highlight": {"background": "#991b1b", "border": "#f87171"}}, "borderWidth": 2, "borderWidthSelected": 3, "font": {"color": "#fee2e2", "face": "system-ui, -apple-system, sans-serif", "size": 12, "bold": true}, "margin": {"top": 8, "bottom": 8, "left": 12, "right": 12}, "shadow": {"enabled": true, "color": "rgba(0,0,0,0.45)", "size": 8, "x": 1, "y": 2}}, {"id": "N4", "label": "[STMT] N4\nAssign result = eval(token...", "title": "Statement: Assign result = eval(token)", "shape": "box", "shapeProperties": {"borderRadius": 8}, "color": {"background": "#064e3b", "border": "#10b981", "highlight": {"background": "#065f46", "border": "#34d399"}}, "borderWidth": 2, "borderWidthSelected": 3, "font": {"color": "#d1fae5", "face": "system-ui, -apple-system, sans-serif", "size": 12, "bold": false}, "margin": {"top": 8, "bottom": 8, "left": 12, "right": 12}, "shadow": {"enabled": true, "color": "rgba(0,0,0,0.45)", "size": 8, "x": 1, "y": 2}}, {"id": "N5", "label": "[RETURN] N5\nReturn valid", "title": "Return Statement: Return valid", "shape": "box", "shapeProperties": {"borderRadius": 8}, "color": {"background": "#581c87", "border": "#a855f7", "highlight": {"background": "#6b21a8", "border": "#c084fc"}}, "borderWidth": 2, "borderWidthSelected": 3, "font": {"color": "#f3e8ff", "face": "system-ui, -apple-system, sans-serif", "size": 12, "bold": true}, "margin": {"top": 8, "bottom": 8, "left": 12, "right": 12}, "shadow": {"enabled": true, "color": "rgba(0,0,0,0.45)", "size": 8, "x": 1, "y": 2}}];
    const rawEdges = [{"id": "e0", "from": "root", "to": "N0", "label": "", "kind": "Control", "is_tainted": false, "title": "Control Dependency: root -> N0", "color": {"color": "#38bdf8", "highlight": "#0ea5e9"}, "width": 1.8, "dashes": [5, 5], "arrows": {"to": {"enabled": true, "scaleFactor": 0.8}}, "smooth": {"type": "cubicBezier", "roundness": 0.2}, "font": {"color": "#94a3b8", "size": 11, "face": "system-ui, sans-serif", "align": "horizontal", "strokeWidth": 0}}, {"id": "e1", "from": "N0", "to": "N1", "label": "", "kind": "Control", "is_tainted": false, "title": "Control Dependency: N0 -> N1", "color": {"color": "#38bdf8", "highlight": "#0ea5e9"}, "width": 1.8, "dashes": [5, 5], "arrows": {"to": {"enabled": true, "scaleFactor": 0.8}}, "smooth": {"type": "cubicBezier", "roundness": 0.2}, "font": {"color": "#94a3b8", "size": 11, "face": "system-ui, sans-serif", "align": "horizontal", "strokeWidth": 0}}, {"id": "e2", "from": "N0", "to": "N2", "label": "", "kind": "Control", "is_tainted": false, "title": "Control Dependency: N0 -> N2", "color": {"color": "#38bdf8", "highlight": "#0ea5e9"}, "width": 1.8, "dashes": [5, 5], "arrows": {"to": {"enabled": true, "scaleFactor": 0.8}}, "smooth": {"type": "cubicBezier", "roundness": 0.2}, "font": {"color": "#94a3b8", "size": 11, "face": "system-ui, sans-serif", "align": "horizontal", "strokeWidth": 0}}, {"id": "e3", "from": "N2", "to": "N3", "label": "", "kind": "Control", "is_tainted": false, "title": "Control Dependency: N2 -> N3", "color": {"color": "#38bdf8", "highlight": "#0ea5e9"}, "width": 1.8, "dashes": [5, 5], "arrows": {"to": {"enabled": true, "scaleFactor": 0.8}}, "smooth": {"type": "cubicBezier", "roundness": 0.2}, "font": {"color": "#94a3b8", "size": 11, "face": "system-ui, sans-serif", "align": "horizontal", "strokeWidth": 0}}, {"id": "e4", "from": "N0", "to": "N4", "label": "", "kind": "Control", "is_tainted": false, "title": "Control Dependency: N0 -> N4", "color": {"color": "#38bdf8", "highlight": "#0ea5e9"}, "width": 1.8, "dashes": [5, 5], "arrows": {"to": {"enabled": true, "scaleFactor": 0.8}}, "smooth": {"type": "cubicBezier", "roundness": 0.2}, "font": {"color": "#94a3b8", "size": 11, "face": "system-ui, sans-serif", "align": "horizontal", "strokeWidth": 0}}, {"id": "e5", "from": "N0", "to": "N5", "label": "", "kind": "Control", "is_tainted": false, "title": "Control Dependency: N0 -> N5", "color": {"color": "#38bdf8", "highlight": "#0ea5e9"}, "width": 1.8, "dashes": [5, 5], "arrows": {"to": {"enabled": true, "scaleFactor": 0.8}}, "smooth": {"type": "cubicBezier", "roundness": 0.2}, "font": {"color": "#94a3b8", "size": 11, "face": "system-ui, sans-serif", "align": "horizontal", "strokeWidth": 0}}, {"id": "e6", "from": "N0", "to": "N2", "label": "token", "kind": "Data", "is_tainted": false, "title": "Data Dependency: N0 -> N2 ('token')", "color": {"color": "#34d399", "highlight": "#10b981"}, "width": 2.0, "dashes": false, "arrows": {"to": {"enabled": true, "scaleFactor": 0.8}}, "smooth": {"type": "cubicBezier", "roundness": 0.2}, "font": {"color": "#94a3b8", "size": 11, "face": "system-ui, sans-serif", "align": "horizontal", "strokeWidth": 0}}, {"id": "e7", "from": "N0", "to": "N4", "label": "token", "kind": "Data", "is_tainted": false, "title": "Data Dependency: N0 -> N4 ('token')", "color": {"color": "#34d399", "highlight": "#10b981"}, "width": 2.0, "dashes": false, "arrows": {"to": {"enabled": true, "scaleFactor": 0.8}}, "smooth": {"type": "cubicBezier", "roundness": 0.2}, "font": {"color": "#94a3b8", "size": 11, "face": "system-ui, sans-serif", "align": "horizontal", "strokeWidth": 0}}, {"id": "e8", "from": "N3", "to": "N5", "label": "valid", "kind": "Data", "is_tainted": false, "title": "Data Dependency: N3 -> N5 ('valid')", "color": {"color": "#34d399", "highlight": "#10b981"}, "width": 2.0, "dashes": false, "arrows": {"to": {"enabled": true, "scaleFactor": 0.8}}, "smooth": {"type": "cubicBezier", "roundness": 0.2}, "font": {"color": "#94a3b8", "size": 11, "face": "system-ui, sans-serif", "align": "horizontal", "strokeWidth": 0}}];

    const container = document.getElementById("pdg-container");
    const nodeDetails = document.getElementById("node-details");

    const nodesDataSet = new vis.DataSet(rawNodes);
    const edgesDataSet = new vis.DataSet(rawEdges);

    const data = {
      nodes: nodesDataSet,
      edges: edgesDataSet
    };

    // 100% Static Layout: Hierarchical directed tree with physics completely disabled
    const options = {
      layout: {
        hierarchical: {
          enabled: true,
          direction: "UD",            // Up-to-Down flow (Root at top, Returns at bottom)
          sortMethod: "directed",      // Follows semantic flow
          levelSeparation: 95,
          nodeSpacing: 180,
          treeSpacing: 220,
          blockShifting: true,
          edgeMinimization: true,
          parentCentralization: true
        }
      },
      physics: {
        enabled: false               // Completely static - zero bouncing, zero movement
      },
      interaction: {
        hover: true,
        tooltipDelay: 100,
        navigationButtons: true,
        keyboard: true,
        dragNodes: true,             // Can manually reposition a node if desired without dragging others
        dragView: true,
        zoomView: true
      }
    };

    const network = new vis.Network(container, data, options);

    // Initial fit once loaded
    network.once("afterDrawing", function() {
      network.fit();
    });

    // Node selection inspector
    network.on("selectNode", function(params) {
      if (params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        const node = nodesDataSet.get(nodeId);
        nodeDetails.style.display = "block";
        nodeDetails.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <strong style="color:#38bdf8; font-size:13px;">Node Inspector: ${nodeId}</strong>
            <button onclick="document.getElementById('node-details').style.display='none'" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:14px;">&times;</button>
          </div>
          <div style="font-size:11px; color:#cbd5e1; line-height:1.4; word-break:break-word;">
            ${node.title.replace(/\n/g, "<br/>")}
          </div>
        `;
      }
    });

    network.on("deselectNode", function() {
      nodeDetails.style.display = "none";
    });

    // Toolbar filters
    const ctrlCheck = document.getElementById("toggle-control");
    const dataCheck = document.getElementById("toggle-data");
    const taintCheck = document.getElementById("toggle-taint-only");

    function applyFilter() {
      const showCtrl = ctrlCheck.checked;
      const showData = dataCheck.checked;
      const taintOnly = taintCheck.checked;

      const filtered = rawEdges.filter(e => {
        if (taintOnly && !e.is_tainted) return false;
        if (e.kind === "Control" && !showCtrl) return false;
        if (e.kind === "Data" && !showData) return false;
        return true;
      });

      edgesDataSet.clear();
      edgesDataSet.add(filtered);
    }

    ctrlCheck.addEventListener("change", applyFilter);
    dataCheck.addEventListener("change", applyFilter);
    taintCheck.addEventListener("change", applyFilter);
  </script>
</body>
</html>
